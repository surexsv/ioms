{% extends 'base.html' %}
{% block title %}{{ title }} — IOMS{% endblock %}
{% block content %}
{% include 'daily_meetings/_subnav.html' with dom_nav='actions' %}
<div class="page-header"><h1>{{ title }}</h1></div>
<div class="card"><form method="post">{% csrf_token %}{% for field in form %}<div class="form-group">{{ field.label_tag }}{{ field }}</div>{% endfor %}
<button type="submit" class="btn btn-primary">Save</button>
<a href="{% if meeting %}{% url 'dom_meeting_detail' meeting.pk %}{% else %}{% url 'dom_action_tracker' %}{% endif %}" class="btn btn-secondary">Cancel</a>
</form></div>
{% endblock %}
