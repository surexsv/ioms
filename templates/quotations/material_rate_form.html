{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ title }}</h1></div>
<div class="card" style="max-width:640px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">{{ field.label_tag }}{{ field }}{% if field.errors %}<div style="color:#dc3545;">{{ field.errors }}</div>{% endif %}</div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'material_rate_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
