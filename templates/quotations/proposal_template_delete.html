{% extends 'base.html' %}
{% block title %}Delete Template — IOMS{% endblock %}
{% block content %}
<div class="page-header"><h1>Delete Template</h1></div>
<div class="card" style="max-width:520px;">
    <p>Delete template <strong>{{ template.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'proposal_template_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
