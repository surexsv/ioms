{% extends 'base.html' %}
{% block title %}{{ page_title }} — IOMS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ page_title }}</h1>
    <a href="{% url 'enquiry_list' %}" class="btn btn-secondary">Back</a>
</div>
<div class="card" style="max-width:800px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}{{ field }}
            {% if field.errors %}<div class="error">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
{% endblock %}
