{% extends 'base.html' %}
{% block title %}Site Progress Update — IOMS{% endblock %}
{% block content %}
<div class="page-header"><h1>Daily Site Update</h1></div>
<div class="card" style="max-width:640px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}<div class="form-group">{{ field.label_tag }}{{ field }}</div>{% endfor %}
        <button type="submit" class="btn btn-primary">Save Update</button>
    </form>
</div>
{% endblock %}
